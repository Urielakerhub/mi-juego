name: Compilar ECLIPSE

on:
  push:
  workflow_dispatch:

jobs:
  cpp:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install scons
      - run: git clone --depth 1 --branch godot-4.3-stable https://github.com/godotengine/godot-cpp.git
      - run: scons platform=${{ matrix.platform }} target=template_release arch=x86_64 use_static_cpp=yes
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: project/bin

  export:
    needs: cpp
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: project/bin
          pattern: bin-*
          merge-multiple: true
      - name: Exportar
        working-directory: project
        run: |
          export HOME=/root
          ls /root/.local/share/godot/export_templates || true
          godot --headless --import || true
          mkdir -p build/windows build/linux
          godot --headless --export-release "Windows Desktop" build/windows/ECLIPSE.exe
          godot --headless --export-release "Linux" build/linux/ECLIPSE.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-juego
          path: project/build
