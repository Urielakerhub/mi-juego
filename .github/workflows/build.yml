name: Compilar ECLIPSE

on:
  push:
  workflow_dispatch:

jobs:
  cpp:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install scons
      - run: git clone --depth 1 --branch godot-4.3-stable https://github.com/godotengine/godot-cpp.git
      - run: scons platform=${{ matrix.platform }} target=template_release arch=x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: project/bin

  export:
    needs: cpp
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: project/bin
          pattern: bin-*
          merge-multiple: true
      - name: Preparar Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
      - name: Exportar
        working-directory: project
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --import || true
          mkdir -p build/windows build/linux build/android
          godot --headless --export-release "Windows Desktop" build/windows/ECLIPSE.exe
          godot --headless --export-release
